[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afcs"
version = "2.0.0a0"
description = "Experimental platform for adaptive fuzzy control of metaheuristics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
opfunu = ["opfunu==1.0.1"]

[project.scripts]
afcs-campaign = "afcs.experiments.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"afcs.problems.benchmarks.cec2017" = ["data.pkl", "LICENSE.txt"]
"afcs.metrics" = ["definitions.json"]
"afcs.persistence" = ["migrations/*.sql"]

